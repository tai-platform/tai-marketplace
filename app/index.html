<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="TAI Marketplace: prompts, skills, instructions, agents and MCP servers for GitHub Copilot, installed with Tai CLI.">
<title>TAI Marketplace</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M6 32c8-14 22-20 36-14l12-8-3 14 3 14-12-8C28 52 14 46 6 32z' fill='%2322d3ee'/%3E%3Ccircle cx='17' cy='29' r='3' fill='%23062a33'/%3E%3C/svg%3E">
<script>
(function () {
  var t = localStorage.getItem("tai-theme");
  if (t) document.documentElement.dataset.theme = t;
})();
</script>
<style>
  :root {
    color-scheme: light;
    --bg: #ffffff; --side: #f3f3f3; --fg: #1f1f1f; --mut: #616161; --line: #e0e0e0; --hover: #f0f7f9;
    --pri: #0e7490; --pri-fg: #ffffff; --code: #f5f5f5;
    --prompt: #b45309; --skill: #6d28d9; --instruction: #1d4ed8; --agent: #be185d; --mcp: #047857;
    --ok: #15803d; --warn: #a16207; --bad: #b91c1c;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #1e1e1e; --side: #252526; --fg: #d4d4d4; --mut: #9d9d9d; --line: #3c3c3c; --hover: #2a2d2e;
    --pri: #4dc9e2; --pri-fg: #0b2a31; --code: #181818;
    --prompt: #e0a458; --skill: #b9a3f5; --instruction: #6cb0ff; --agent: #f08bbb; --mcp: #4cc9a0;
    --ok: #6ccf8e; --warn: #e3c05a; --bad: #f48771;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #1e1e1e; --side: #252526; --fg: #d4d4d4; --mut: #9d9d9d; --line: #3c3c3c; --hover: #2a2d2e;
      --pri: #4dc9e2; --pri-fg: #0b2a31; --code: #181818;
      --prompt: #e0a458; --skill: #b9a3f5; --instruction: #6cb0ff; --agent: #f08bbb; --mcp: #4cc9a0;
      --ok: #6ccf8e; --warn: #e3c05a; --bad: #f48771;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; color: var(--fg); background: var(--bg); font: 14px/1.55 "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif; }
  #view { flex: 1; }
  a { color: var(--pri); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code, pre { font-family: Consolas, "Cascadia Mono", Menlo, ui-monospace, monospace; }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 0 24px; }
  :focus-visible { outline: 1px solid var(--pri); outline-offset: 1px; }

  nav { background: var(--side); border-bottom: 1px solid var(--line); }
  nav .wrap { display: flex; align-items: stretch; gap: 24px; height: 48px; }
  .brand { display: flex; align-items: center; gap: 9px; color: var(--fg); font-weight: 600; font-size: 15px; }
  .brand:hover { text-decoration: none; }
  .brand svg { width: 24px; height: 24px; color: var(--pri); }
  .links { display: flex; gap: 2px; }
  .links a { display: flex; align-items: center; padding: 0 12px; color: var(--mut); border-bottom: 2px solid transparent; }
  .links a:hover { color: var(--fg); text-decoration: none; }
  .links a.on { color: var(--fg); border-bottom-color: var(--pri); }
  .sp { flex: 1; }
  .icon-btn { align-self: center; width: 32px; height: 32px; display: grid; place-items: center; border: 0; background: transparent; color: var(--mut); border-radius: 4px; cursor: pointer; padding: 0; }
  .icon-btn:hover { background: var(--hover); color: var(--fg); }
  .icon-btn svg { width: 18px; height: 18px; }

  .hero { padding: 40px 24px 8px; }
  h1 { font-size: 28px; line-height: 1.25; font-weight: 600; margin: 0 0 8px; letter-spacing: -.01em; }
  .lead { color: var(--mut); margin: 0; max-width: 760px; }
  .joke { color: var(--mut); margin: 6px 0 0; font-size: 13px; }

  .tools { display: flex; gap: 8px; flex-wrap: wrap; margin: 24px 0 16px; }
  input, select { font: inherit; height: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--fg); }
  input:focus, select:focus { outline: 1px solid var(--pri); border-color: var(--pri); }
  input { flex: 1; min-width: 240px; }
  input::placeholder { color: var(--mut); }

  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 960px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 620px) { .grid { grid-template-columns: minmax(0, 1fr); } }
  .card { display: flex; flex-direction: column; gap: 10px; padding: 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); cursor: pointer; }
  .card:hover { background: var(--hover); border-color: var(--pri); }
  .card .head { display: flex; gap: 12px; align-items: flex-start; }
  .tile { flex: none; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 6px; font: 700 17px Consolas, monospace; color: var(--k); background: color-mix(in srgb, var(--k) 14%, transparent); }
  .card .id { flex: 1; min-width: 0; }
  .card h3 { margin: 0; font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
  .card h3 a { color: var(--fg); }
  .card h3 a:hover { color: var(--pri); text-decoration: none; }
  .meta { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
  .ver { font: 12px Consolas, monospace; color: var(--mut); }
  .card p { margin: 0; color: var(--mut); flex: 1; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .badges.stack { flex-direction: column; align-items: flex-end; gap: 4px; }
  .badges.tags { flex-wrap: nowrap; overflow: hidden; min-height: 22px; }
  .badges.tags .tag { white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .badges.tags .more { flex: none; }
  .kind { display: inline-block; padding: 0 6px; font: 600 11px/18px Consolas, monospace; text-transform: uppercase; color: var(--k); border: 1px solid color-mix(in srgb, var(--k) 55%, transparent); border-radius: 3px; }
  .phase { display: inline-block; padding: 0 6px; font: 600 11px/18px Consolas, monospace; text-transform: uppercase; color: var(--pri-fg); background: var(--pri); border-radius: 3px; }
  .mat { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--m); }
  .mat::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--m); }
  .mat-stable { --m: var(--ok); } .mat-beta { --m: var(--warn); } .mat-deprecated { --m: var(--bad); }
  .tag { font-size: 12px; color: var(--mut); padding: 0 7px; line-height: 20px; background: var(--side); border-radius: 3px; }
  .tag.more { color: var(--pri); }
  .by { font-size: 12px; color: var(--mut); }
  .k-prompt { --k: var(--prompt); } .k-skill { --k: var(--skill); } .k-instruction { --k: var(--instruction); } .k-agent { --k: var(--agent); } .k-mcp { --k: var(--mcp); }

  .copy { display: flex; align-items: center; gap: 4px; background: var(--code); border: 1px solid var(--line); border-radius: 4px; padding: 2px 2px 2px 10px; min-width: 0; }
  .copy code { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12.5px; padding: 3px 0; }
  .copy code::before { content: "$ "; color: var(--mut); }
  .copy button { flex: none; width: 28px; height: 28px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 3px; background: transparent; color: var(--pri); cursor: pointer; }
  .copy button:hover { background: var(--hover); }
  .copy button svg { width: 15px; height: 15px; }
  .copy button.done { color: var(--ok); }

  .pager { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin: 20px 0 48px; color: var(--mut); font-size: 13px; }
  .pages { display: flex; gap: 4px; }
  .pages button { min-width: 30px; height: 30px; padding: 0 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--fg); font: inherit; cursor: pointer; }
  .pages button.on { background: var(--pri); border-color: var(--pri); color: var(--pri-fg); }
  .pages button:disabled { opacity: .4; cursor: default; }
  .pages button:not(:disabled):not(.on):hover { border-color: var(--pri); color: var(--pri); }
  .empty { color: var(--mut); text-align: center; padding: 60px 0; grid-column: 1 / -1; }

  .page { padding: 28px 24px 56px; }
  .crumb { font-size: 13px; color: var(--mut); margin-bottom: 18px; }
  .detail { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 32px; align-items: start; }
  .detail .head { display: flex; gap: 16px; align-items: flex-start; }
  .detail .tile { width: 56px; height: 56px; font-size: 24px; border-radius: 8px; }
  .detail .id { flex: 1; min-width: 0; }
  .detail h2 { font-size: 24px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
  .detail .badges { margin-top: 6px; }
  .detail .desc { color: var(--mut); margin: 18px 0 0; max-width: 720px; }
  .panel { border: 1px solid var(--line); border-radius: 6px; padding: 16px; margin-top: 16px; }
  .panel h3 { display: flex; justify-content: space-between; align-items: center; margin: 0 0 12px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--mut); }
  .steps { display: grid; gap: 12px; }
  .steps .lbl { font-size: 13px; color: var(--mut); margin-bottom: 4px; }
  .tabs { display: inline-flex; gap: 2px; margin-left: auto; }
  .tabs button { font: inherit; font-size: 12px; text-transform: none; letter-spacing: 0; padding: 2px 10px; border: 1px solid var(--line); background: transparent; color: var(--mut); border-radius: 4px; cursor: pointer; }
  .tabs button[aria-pressed="true"] { background: var(--pri); border-color: var(--pri); color: #fff; }
  .md { padding: 4px 2px; line-height: 1.6; overflow-wrap: anywhere; }
  .md h1, .md h2, .md h3, .md h4 { margin: 22px 0 8px; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--fg); display: block; }
  .md h1 { font-size: 24px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .md h2 { font-size: 19px; padding-bottom: 5px; border-bottom: 1px solid var(--line); }
  .md h3 { font-size: 16px; }
  .md h4 { font-size: 14px; }
  .md > :first-child { margin-top: 0; }
  .md p, .md li { color: var(--fg); }
  .md p { margin: 0 0 12px; }
  .md ul, .md ol { padding-left: 24px; margin: 0 0 12px; }
  .md code { background: var(--code); padding: 1px 5px; border-radius: 3px; font-size: .92em; }
  .md pre { background: var(--code); border: 1px solid var(--line); border-radius: 4px; padding: 12px; overflow: auto; margin: 0 0 12px; font-size: 13px; line-height: 1.5; }
  .md pre code { background: none; padding: 0; }
  .md table { border-collapse: collapse; margin: 0 0 12px; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--line); padding: 6px 12px; text-align: left; }
  .md th { background: var(--code); font-weight: 600; }
  .md blockquote { margin: 0 0 12px; padding: 0 14px; border-left: 3px solid var(--line); color: var(--mut); }
  .md .diagram { display: flex; justify-content: center; margin: 0 0 12px; padding: 14px; border: 1px solid var(--line); border-radius: 4px; overflow: auto; color: var(--mut); }
  .md .diagram svg { max-width: 100%; height: auto; }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }
  .md .meta-block { background: var(--code); border: 1px solid var(--line); border-radius: 4px; padding: 8px 12px; margin: 0 0 16px; font-size: 13px; color: var(--mut); }
  .md .meta-block b { color: var(--fg); font-weight: 600; }
  pre.src { margin: 0; padding: 14px; background: var(--code); border: 1px solid var(--line); border-radius: 4px; overflow: auto; max-height: 560px; font-size: 13px; line-height: 1.5; }
  aside { position: sticky; top: 16px; }
  aside .panel:first-child { margin-top: 0; }
  dl { margin: 0; display: grid; grid-template-columns: 70px 1fr; gap: 8px 10px; font-size: 13px; }
  dt { color: var(--mut); } dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .who { display: inline-flex; align-items: center; gap: 6px; margin: 0 10px 6px 0; }
  .who img { border-radius: 50%; }

  .doc { max-width: 800px; }
  .doc h2 { font-size: 28px; font-weight: 600; margin: 0 0 8px; letter-spacing: -.01em; }
  .doc h3 { font-size: 18px; font-weight: 600; margin: 32px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .doc p, .doc li { color: var(--mut); }
  .doc strong { color: var(--fg); }
  .doc .copy { margin: 8px 0; }
  .doc code:not(.blk) { background: var(--code); padding: 1px 5px; border-radius: 3px; font-size: .92em; color: var(--fg); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 10px 0; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--mut); font-weight: 600; font-size: 12px; background: var(--side); }
  td:first-child { white-space: nowrap; }
  .cmds { display: grid; gap: 6px; margin: 12px 0; }

  footer { border-top: 1px solid var(--line); background: var(--side); padding: 14px 0; color: var(--mut); font-size: 12px; }
  footer .wrap { display: flex; gap: 14px; flex-wrap: wrap; justify-content: space-between; }

  @media (max-width: 860px) {
    .detail { grid-template-columns: 1fr; }
    aside { position: static; }
    nav .wrap { gap: 8px; }
  }
</style>
</head>
<body>
<nav>
  <div class="wrap">
    <a class="brand" href="#/" aria-label="TAI Marketplace home">
      <svg viewBox="0 0 64 64" fill="none" aria-hidden="true"><path d="M5 32C13 17 28 11 43 17l13-9-4 15 4 18-13-9C28 53 13 47 5 32z" fill="currentColor" fill-opacity=".3" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M22 20c4 8 4 16 0 24M32 19c4 9 4 17 0 26" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="14" cy="30" r="2.6" fill="currentColor"/></svg>
      <span>TAI Marketplace</span>
    </a>
    <div class="links">
      <a href="#/" data-nav="home">Catalog</a>
      <a href="#/cli" data-nav="cli">CLI</a>
      <a href="https://github.com/tai-platform/tai-marketplace" rel="noopener">Contribute</a>
    </div>
    <div class="sp"></div>
    <a class="icon-btn" href="https://github.com/tai-platform/tai-marketplace" rel="noopener" aria-label="GitHub repository"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.52-1.33-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.15.08 1.76 1.19 1.76 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.78 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.42-2.69 5.39-5.25 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5z"/></svg></a>
    <button class="icon-btn" id="theme" aria-label="Toggle light and dark theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  </div>
</nav>

<div id="view"></div>

<footer>
  <div class="wrap">
    <span>Apache 2.0 · <a href="https://www.linkedin.com/in/hilmim/">Mohammed HILMI</a></span>
    <span><a href="https://github.com/tai-platform/tai-marketplace">Share an asset with a pull request</a></span>
  </div>
</footer>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const cmp = (a, b) => a.localeCompare(b, undefined, { numeric: true });
const KINDS = ["prompt", "skill", "instruction", "agent", "mcp"];
const PAGE_SIZE = 18;
const PHASES = ["all", "design", "build", "review", "test", "docs"];
const COPY_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>`;
const DONE_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>`;
const home = location.origin + location.pathname.replace(/\/[^/]*$/, "");
let assets = [];
let filters = { q: "", kind: "", maturity: "", phase: "", page: 1 };

const latest = (a) => a.versions.map((v) => v.version).sort(cmp).pop();
const find = (kind, name) => assets.find((a) => a.kind === kind && a.name === name);
const day = (d) => (d ? d.slice(0, 10) : "-");
const person = (p) => { const login = p.login ?? p; return `<a class="who" href="https://github.com/${encodeURIComponent(login)}" rel="noopener"><img alt="" src="https://github.com/${encodeURIComponent(login)}.png?size=40" width="20" height="20" loading="lazy">${esc(login)}</a>`; };
const kindBadge = (k) => `<span class="kind k-${esc(k)}">${esc(k)}</span>`;
const tile = (k) => esc(k[0].toUpperCase());
const phaseBadge = (p) => (p ? `<span class="phase">${esc(p)}</span>` : "");
const matBadge = (m) => `<span class="mat mat-${esc(m)}">${esc(m)}</span>`;
const copyRow = (cmd) => `<div class="copy"><code title="${esc(cmd)}">${esc(cmd)}</code><button type="button" data-copy="${esc(cmd)}" aria-label="Copy command" title="Copy">${COPY_ICON}</button></div>`;
const globalCmd = (a) => `tai install ${a.kind} ${a.name} -g`;

function hero() {
  return `
  <section class="hero wrap">
    <h1>Think AI. Ship robust software.</h1>
    <p class="lead">The prompts, skills, instructions, agents and MCP servers behind an AI driven SDLC, one command away.</p>
    <p class="joke">tai is short for think AI. It is also a fish, and a tasty one needs the right ingredients.</p>
  </section>`;
}

function card(a) {
  return `
  <article class="card k-${esc(a.kind)}" data-href="#/a/${esc(a.kind)}/${esc(a.name)}">
    <div class="head">
      <span class="tile">${tile(a.kind)}</span>
      <div class="id"><h3><a href="#/a/${esc(a.kind)}/${esc(a.name)}">${esc(a.name)}</a></h3><div class="meta"><span class="ver">v${esc(latest(a))}</span>${matBadge(a.maturity)}</div></div>
      <div class="badges stack">${phaseBadge(a.phase)}</div>
    </div>
    <p>${esc(a.description)}</p>
    <div class="badges tags">${(a.tags || []).slice(0, 2).map((t) => `<span class="tag">${esc(t)}</span>`).join("")}${(a.tags || []).length > 2 ? `<span class="tag more" title="${esc(a.tags.slice(2).join(", "))}">+${a.tags.length - 2} more</span>` : ""}</div>
    ${copyRow(globalCmd(a))}
  </article>`;
}

function list() {
  const q = filters.q.toLowerCase();
  const items = assets.filter((a) =>
    (!filters.kind || a.kind === filters.kind) &&
    (!filters.maturity || a.maturity === filters.maturity) &&
    (!filters.phase || a.phase === filters.phase) &&
    (!q || [a.name, a.kind, a.description, a.author, ...(a.tags || [])].join(" ").toLowerCase().includes(q)));
  const pages = Math.max(1, Math.ceil(items.length / PAGE_SIZE));
  filters.page = Math.min(Math.max(1, filters.page), pages);
  const from = (filters.page - 1) * PAGE_SIZE;
  const shown = items.slice(from, from + PAGE_SIZE);
  $("#grid").innerHTML = shown.length ? shown.map(card).join("") : `<div class="empty">Nothing matches. Try fewer words.</div>`;
  const total = items.length === assets.length ? `${assets.length} assets` : `${items.length} of ${assets.length} assets`;
  const nums = Array.from({ length: pages }, (_, i) => i + 1)
    .map((n) => `<button type="button" data-page="${n}" ${n === filters.page ? 'class="on" aria-current="page"' : ""}>${n}</button>`).join("");
  $("#pager").innerHTML = `<span>${total}${shown.length ? `, showing ${from + 1} to ${from + shown.length}` : ""}</span>
    ${pages > 1 ? `<div class="pages"><button type="button" data-page="${filters.page - 1}" ${filters.page === 1 ? "disabled" : ""} aria-label="Previous page">&lsaquo;</button>${nums}<button type="button" data-page="${filters.page + 1}" ${filters.page === pages ? "disabled" : ""} aria-label="Next page">&rsaquo;</button></div>` : ""}`;
}

function home_() {
  const kinds = [...new Set(assets.map((a) => a.kind))];
  const mats = [...new Set(assets.map((a) => a.maturity))];
  const phases = PHASES.filter((p) => assets.some((a) => a.phase === p));
  $("#view").innerHTML = `${hero()}
  <main class="wrap">
    <div class="tools">
      <input id="q" type="search" placeholder="Search by name, kind, tag or author" value="${esc(filters.q)}" aria-label="Search assets">
      <select id="kind" aria-label="Filter by kind"><option value="">All kinds</option>${kinds.map((k) => `<option ${filters.kind === k ? "selected" : ""}>${esc(k)}</option>`).join("")}</select>
      <select id="maturity" aria-label="Filter by maturity"><option value="">Any maturity</option>${mats.map((m) => `<option ${filters.maturity === m ? "selected" : ""}>${esc(m)}</option>`).join("")}</select>
      <select id="phase" aria-label="Filter by phase"><option value="">Any phase</option>${phases.map((p) => `<option ${filters.phase === p ? "selected" : ""}>${esc(p)}</option>`).join("")}</select>
    </div>
    <div class="grid" id="grid"></div>
    <div class="pager" id="pager"></div>
  </main>`;
  for (const id of ["q", "kind", "maturity", "phase"]) $("#" + id).addEventListener("input", (e) => { filters[id] = e.target.value; filters.page = 1; list(); });
  $("#pager").addEventListener("click", (e) => {
    const b = e.target.closest("[data-page]");
    if (b && !b.disabled) { filters.page = Number(b.dataset.page); list(); window.scrollTo({ top: $("#grid").offsetTop - 140 }); }
  });
  list();
}

function renderMd(src) {
  let meta = "";
  const fm = src.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
  if (fm) {
    src = src.slice(fm[0].length);
    const rows = fm[1].split(/\r?\n/).map((l) => l.match(/^([A-Za-z][\w-]*):\s*(.*)$/)).filter(Boolean)
      .map((m) => `<b>${esc(m[1])}</b> ${esc(m[2].replace(/^['"]|['"]$/g, ""))}`);
    if (rows.length) meta = `<div class="meta-block">${rows.join("<br>")}</div>`;
  }
  const inline = (s) => {
    const codes = [];
    s = esc(s).replace(/`([^`]+)`/g, (_, c) => `\u0000${codes.push(`<code>${c}</code>`) - 1}\u0000`);
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) => /^(https?:\/\/|#|\.{0,2}\/|[\w-]+(\.[\w-]+)*$)/.test(u) ? `<a href="${u}" target="_blank" rel="noopener noreferrer">${t}</a>` : m);
    return s.replace(/\u0000(\d+)\u0000/g, (_, i) => codes[i]);
  };
  const lines = src.split(/\r?\n/);
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    let m;
    if ((m = l.match(/^\s*(`{3,}|~{3,})\s*([\w-]*)/))) {
      const buf = [];
      i++;
      while (i < lines.length && !lines[i].trim().startsWith(m[1])) buf.push(lines[i++]);
      i++;
      const body = buf.join("\n");
      const diagrams = m[2] === "mermaid" ? [body] : /^(markdown|md)$/.test(m[2]) ? [...body.matchAll(/^```mermaid\r?\n([\s\S]*?)^```/gm)].map((d) => d[1]) : [];
      diagrams.forEach((d) => out.push(`<div class="diagram" data-diagram="${esc(d)}">Rendering diagram...</div>`));
      if (m[2] !== "mermaid") out.push(`<pre><code>${esc(body)}</code></pre>`);
    } else if ((m = l.match(/^(#{1,4})\s+(.*)$/))) {
      out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`);
      i++;
    } else if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)) {
      out.push("<hr>");
      i++;
    } else if (/^\s*\|.*\|\s*$/.test(l) && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1] || "")) {
      const cells = (r) => r.trim().replace(/^\||\|$/g, "").split("|").map((c) => inline(c.trim()));
      const head = cells(l);
      i += 2;
      const body = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) body.push(cells(lines[i++]));
      out.push(`<table><thead><tr>${head.map((c) => `<th>${c}</th>`).join("")}</tr></thead><tbody>${body.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`);
    } else if (/^\s*>/.test(l)) {
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ""));
      out.push(`<blockquote>${inline(buf.join(" "))}</blockquote>`);
    } else if (/^\s*([-*+]|\d+\.)\s+/.test(l)) {
      const tag = /^\s*\d+\./.test(l) ? "ol" : "ul";
      const items = [];
      while (i < lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i])) items.push(inline(lines[i++].replace(/^\s*([-*+]|\d+\.)\s+/, "")));
      out.push(`<${tag}>${items.map((t) => `<li>${t}</li>`).join("")}</${tag}>`);
    } else if (!l.trim()) {
      i++;
    } else {
      const buf = [];
      while (i < lines.length && lines[i].trim() && !/^\s*(`{3,}|~{3,}|#{1,4}\s|>|([-*+]|\d+\.)\s|\|)/.test(lines[i])) buf.push(lines[i++]);
      if (!buf.length) { buf.push(lines[i++]); }
      out.push(`<p>${inline(buf.join(" "))}</p>`);
    }
  }
  return meta + out.join("");
}

let mermaidLib;
async function drawDiagrams(root) {
  const nodes = [...root.querySelectorAll(".diagram")];
  if (!nodes.length) return;
  try {
    mermaidLib ||= (await import("https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs")).default;
    mermaidLib.initialize({ startOnLoad: false, securityLevel: "strict", theme: (document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) === "dark" ? "dark" : "default" });
    for (const [i, n] of nodes.entries()) {
      try {
        const { svg } = await mermaidLib.render(`mmd-${Date.now()}-${i}`, n.dataset.diagram);
        n.innerHTML = svg;
      } catch {
        n.innerHTML = `<pre><code>${esc(n.dataset.diagram)}</code></pre>`;
      }
    }
  } catch {
    nodes.forEach((n) => { n.innerHTML = `<pre><code>${esc(n.dataset.diagram)}</code></pre>`; });
  }
}

async function detail(kind, name) {
  const a = find(kind, name);
  if (!a) return notFound();
  const v = a.versions.find((x) => x.version === latest(a));
  const spec = `${a.kind} ${a.name}`;
  const global = a.kind === "mcp";
  const deps = v.dependencies || [];
  const others = (a.contributors || []).filter((c) => (c.login ?? c).toLowerCase() !== String(a.author || "").toLowerCase());
  const steps = [
    ...(global ? [] : [["Working repository", `tai install ${spec}`]]),
    ["Global", `tai install ${spec} -g`],
    ["Preview", `tai view ${spec}`],
    ["Other marketplace", `tai install ${spec}${global ? " -g" : ""} --marketplace ${home}`],
  ];
  const reqs = [
    `<div><div class="lbl"><a href="#/cli">Tai CLI</a></div>${copyRow("npm install -g @tai-platform/tai")}</div>`,
    ...deps.map((d) => {
      const label = find(d.kind, d.name) ? `<a href="#/a/${esc(d.kind)}/${esc(d.name)}">${esc(d.kind)} ${esc(d.name)}</a>` : `${esc(d.kind)} ${esc(d.name)}`;
      return `<div class="lbl">${label} <span class="ver">${esc(d.version || "latest")}</span></div>`;
    }),
  ].join("");  $("#view").innerHTML = `
  <main class="wrap page">
    <div class="crumb"><a href="#/">Catalog</a> / ${esc(a.kind)} / ${esc(a.name)}</div>
    <div class="detail">
      <div>
        <div class="head k-${esc(a.kind)}"><span class="tile">${tile(a.kind)}</span><div class="id"><h2>${esc(a.name)} <span class="ver">v${esc(latest(a))}</span></h2><div class="badges">${phaseBadge(a.phase)}${matBadge(a.maturity)}</div></div></div>
        <p class="desc">${esc(a.description)}</p>
        <section class="panel" style="margin-top:28px"><h3>Requirements</h3><div class="steps">${reqs}</div></section>
        <section class="panel"><h3>Install</h3><div class="steps">${steps.map(([t, c]) => `<div><div class="lbl">${esc(t)}</div>${copyRow(c)}</div>`).join("")}</div></section>
        <section class="panel"><h3 id="src-title">${esc(v.files[0])}<span class="tabs" id="tabs" hidden><button type="button" data-tab="preview" aria-pressed="true">Preview</button><button type="button" data-tab="source" aria-pressed="false">Source</button></span></h3><div class="md" id="preview" hidden></div><pre class="src" id="srcbox"><code id="src">Loading...</code></pre></section>
      </div>
      <aside>
        <section class="panel"><h3>Details${kindBadge(a.kind)}</h3>
          <dl>
            <dt>Author</dt><dd>${a.author ? person(a.author) : "-"}</dd>
${a.versions.length > 1 ? `            <dt>Versions</dt><dd>${esc(a.versions.map((x) => x.version).join(", "))}</dd>` : ""}
            <dt>Created</dt><dd>${day(a.createdAt)}</dd>
            <dt>Updated</dt><dd>${day(a.updatedAt)}</dd>
            <dt>Tags</dt><dd>${(a.tags || []).map((t) => `<span class="tag">${esc(t)}</span>`).join(" ") || "-"}</dd>
          </dl>
        </section>
        ${others.length ? `<section class="panel"><h3>Contributors</h3>${others.map(person).join("")}</section>` : ""}
        <section class="panel"><h3>CLI</h3><a href="#/cli">Install and use Tai CLI &rarr;</a></section>
      </aside>
    </div>
  </main>`;
  try {
    const text = await fetch(`${v.path}/${v.files[0]}`).then((r) => { if (!r.ok) throw new Error(r.status); return r.text(); });
    const el = $("#src");
    if (el) el.textContent = text;
    if (/\.md$/i.test(v.files[0]) && $("#preview")) {
      $("#preview").innerHTML = renderMd(text);
      drawDiagrams($("#preview"));
      const show = (t) => {
        $("#preview").hidden = t !== "preview";
        $("#srcbox").hidden = t !== "source";
        document.querySelectorAll("#tabs button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.tab === t)));
      };
      $("#tabs").hidden = false;
      $("#tabs").addEventListener("click", (e) => { const b = e.target.closest("button[data-tab]"); if (b) show(b.dataset.tab); });
      show("preview");
    }
  } catch (e) {
    const el = $("#src");
    if (el) el.textContent = `Could not load the file (${e.message}).`;
  }
}

function cli() {
  $("#view").innerHTML = `
  <main class="wrap page"><div class="doc">
    <div class="crumb"><a href="#/">Catalog</a> / CLI</div>
    <h2>Tai CLI</h2>
    <p>The package manager for GitHub Copilot assets. It holds no catalog of its own: it fetches from a marketplace like this one and installs per repository or globally in <code>~/.copilot</code>. Zero runtime dependencies, Apache 2.0.</p>

    <h3>Install</h3>
    <p>Needs Node.js 20 or later.</p>
    ${copyRow("npm install -g @tai-platform/tai")}
    ${copyRow("tai --version")}

    <h3>Use it</h3>
    <div class="cmds">
      ${[
        "tai search review",
        "tai view skill spring-starter",
        "tai install skill spring-starter",
        "tai install agent github-wiki -g",
        "tai list",
        "tai outdated",
        "tai update",
        "tai uninstall skill spring-starter",
        "tai doctor",
      ].map(copyRow).join("")}
    </div>
    <p>Assets are named <code>&lt;kind&gt; &lt;name&gt;</code>. Add <code>-g</code> to install for every repository, <code>--dry-run</code> to preview, <code>--json</code> for scripts. Pin a range with <code>name@^1.0.0</code>.</p>

    <h3>Where files go</h3>
    <table>
      <tr><th>Kind</th><th>Working repository</th><th>With -g</th></tr>
      <tr><td>prompt</td><td><code>.github/prompts/</code></td><td><code>~/.copilot/prompts/</code></td></tr>
      <tr><td>instruction</td><td><code>.github/instructions/</code></td><td><code>~/.copilot/instructions/</code></td></tr>
      <tr><td>agent</td><td><code>.github/agents/</code></td><td><code>~/.copilot/agents/</code></td></tr>
      <tr><td>skill</td><td><code>.github/skills/</code></td><td><code>~/.copilot/skills/</code></td></tr>
      <tr><td>mcp</td><td>not supported</td><td>merged into <code>~/.copilot/mcp-config.json</code></td></tr>
    </table>
    <p>Repository installs are recorded in <code>.tai.yaml</code>. Commit it and teammates restore the same set with <code>tai install</code>.</p>

    <h3>Use another marketplace</h3>
    <p>This site is the default. Point tai at a private one with a flag, an environment variable or a saved setting.</p>
    ${copyRow("tai config set marketplace https://tai.internal.example.com")}
    ${copyRow("export TAI_TOKEN=<token>")}
    <p>The token is a Bearer token, sent only to that host and never over plain http.</p>

    <h3>Safe by design</h3>
    <ul>
      <li><strong>Verified.</strong> Every file is checked against the SHA-256 in the catalog before it is written.</li>
      <li><strong>Atomic.</strong> Writes go to a temp sibling and are renamed. Files you edited are backed up, never overwritten silently.</li>
      <li><strong>Never executes.</strong> Skills may ship helper scripts. tai copies them and never runs them.</li>
    </ul>

    <p><a href="https://www.npmjs.com/package/@tai-platform/tai" rel="noopener">npm</a> &middot; <a href="https://github.com/tai-platform/tai-cli" rel="noopener">source and full documentation</a></p>
  </div></main>`;
}

function notFound() {
  $("#view").innerHTML = `<main class="wrap page"><div class="empty">Nothing here. <a href="#/">Back to the catalog</a></div></main>`;
}

function route() {
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  const [a, b, c] = h.split("/");
  document.querySelectorAll("[data-nav]").forEach((l) => l.classList.toggle("on", l.dataset.nav === (a === "cli" ? "cli" : "home")));
  window.scrollTo(0, 0);
  if (a === "cli") return cli();
  if (a === "a" && b && c) return detail(b, c);
  if (a && b && KINDS.includes(a)) return detail(a, b);
  return home_();
}

document.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-copy]");
  if (btn) {
    e.stopPropagation();
    navigator.clipboard.writeText(btn.dataset.copy).then(() => {
      btn.innerHTML = DONE_ICON;
      btn.classList.add("done");
      setTimeout(() => { btn.innerHTML = COPY_ICON; btn.classList.remove("done"); }, 1400);
    });
    return;
  }
  const c = e.target.closest(".card");
  if (c && !e.target.closest("a")) location.hash = c.dataset.href;
});

$("#theme").addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme
    ? document.documentElement.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  const next = dark ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  localStorage.setItem("tai-theme", next);
});

window.addEventListener("hashchange", () => { if (assets.length) route(); });

fetch("catalog.json").then((r) => r.json()).then((c) => {
  assets = c.assets.sort((a, b) => a.name.localeCompare(b.name));
  route();
}).catch((e) => {
  $("#view").innerHTML = `<main class="wrap page"><div class="empty">Could not load catalog.json: ${esc(e.message)}</div></main>`;
  if (location.hash.startsWith("#/cli")) { assets = []; cli(); }
});
</script>
</body>
</html>
